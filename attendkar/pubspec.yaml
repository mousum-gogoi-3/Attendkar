name: attendkar
description: "A professional productivity app for attendance tracking."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.1
  google_fonts: ^6.1.0
  intl: ^0.19.0
  fl_chart: ^0.66.0
  uuid: ^4.3.3
  flutter_animate: ^4.5.2
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  crypto: ^3.0.7
  shared_preferences: ^2.5.4
  csv: ^5.0.2
  file_picker: ^8.1.7
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  excel: ^4.0.6
  pdf: ^3.12.0
  share_plus: ^12.0.1
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.6

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.jpg"

flutter_native_splash:
  color: "#F5F7F6"
  image: "assets/logo.jpg"
  color_dark: "#121212"
  image_dark: "assets/logo_dark.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
    - assets/logo_dark.jpg
    - assets/students.csv
